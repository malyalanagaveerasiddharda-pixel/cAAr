<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Driving Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <div id="speedometer">Speed: <span id="speed-val">0</span> km/h | Coins: <span id="coin-val">0</span></div>
        <div id="controls">
            W/Up: Accelerate | S/Down: Brake | A/Left: Turn Left | D/Right: Turn Right<br>
            <strong>Shift: SPEED BOOST</strong>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
